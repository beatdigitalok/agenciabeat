name: Agencia Beat 2.0 - QA editorial
on:
  push:
    branches:
      - agencia-beat-2.0
    paths:
      - 'editorial-backend/**'
      - '.github/workflows/qa-editorial.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'editorial-backend/**'
      - '.github/workflows/qa-editorial.yml'
permissions:
  contents: read
jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis
        run: |
          node --check editorial-backend/core.mjs
          node --check editorial-backend/rss-core.mjs
          node --check editorial-backend/worker.mjs
          node --check editorial-backend/editorial-safety.test.mjs
          node --check editorial-backend/access-safety.test.mjs
          node --check editorial-backend/cms-lifecycle.test.mjs
          node --check editorial-backend/rss-diagnostics.test.mjs
      - name: Pruebas de reglas editoriales y acceso
        run: node --test editorial-backend/test.mjs editorial-backend/editorial-safety.test.mjs editorial-backend/access-safety.test.mjs editorial-backend/cms-lifecycle.test.mjs editorial-backend/rss-diagnostics.test.mjs
      - name: Compilar bundle Worker QA sin desplegar
        run: |
          npm exec --yes --package=esbuild@0.25.12 -- esbuild editorial-backend/worker.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=worker-qa-bundle.mjs
          node --check worker-qa-bundle.mjs
          test -s worker-qa-bundle.mjs
          sha256sum worker-qa-bundle.mjs > worker-qa-bundle.sha256
      - name: Guardar paquete de revisión QA
        uses: actions/upload-artifact@v4
        with:
          name: beat-editorial-worker-qa-${{ github.sha }}
          path: |
            worker-qa-bundle.mjs
            worker-qa-bundle.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Estado de despliegue
        run: echo "QA local del repositorio; no despliega Worker, no escribe Supabase ni Blogger."
